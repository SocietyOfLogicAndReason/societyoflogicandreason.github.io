<!DOCTYPE html>
<html>
<head>
  <title>Investments</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 30px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: #161b22;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 18px;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
      font-size: 18px;
    }

    .title {
      font-size: 20px;
      margin-bottom: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
    }

    .label {
      color: #8b949e;
    }

    .price {
      font-style: italic;
      font-size: 14px;
      color: #9da7b3;
    }

    .value {
      font-weight: bold;
      font-size: 20px;
    }

    .total-box {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin-top: 25px;
      border-bottom: 3px solid #e6edf3;
      padding-bottom: 10px;
    }

    .icon {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>

<h1>Investments</h1>

<div class="container">

  <div class="card">
    <div class="title">Eventide Gilead Fund</div>
    <div class="row"><span class="label">Price per share</span><span class="price">$<span id="gilead-price">...</span></span></div>
    <div class="row"><span class="label">Value</span><span class="value">$<span id="gilead-value">...</span></span></div>
  </div>

  <div class="card">
    <div class="title">Eventide Balanced Fund</div>
    <div class="row"><span class="label">Price per share</span><span class="price">$<span id="balanced-price">...</span></span></div>
    <div class="row"><span class="label">Value</span><span class="value">$<span id="balanced-value">...</span></span></div>
  </div>

  <div class="card">
    <div class="title">Eventide Dividend Growth</div>
    <div class="row"><span class="label">Price per share</span><span class="price">$<span id="dividend-price">...</span></span></div>
    <div class="row"><span class="label">Value</span><span class="value">$<span id="dividend-value">...</span></span></div>
  </div>

  <div class="card">
    <div class="title">Bitcoin</div>
    <div class="row"><span class="label">Bitcoin price</span><span class="price">$<span id="btc-price">...</span></span></div>
    <div class="row"><span class="label">Value</span><span class="value">$<span id="btc-value">...</span></span></div>
  </div>

  <div class="total-box">
    Total Investments: $<span id="total">...</span>
  </div>

</div>

<script>
const funds = [
  { id: "gilead", ticker: "ETGLX", shares: 121.059 },
  { id: "balanced", ticker: "ETBAX", shares: 682.409 },
  { id: "dividend", ticker: "ETDGX", shares: 533.973 }
];

const bitcoinAmount = 0.176337455;

const fallbackPrices = {
  ETGLX: 55.00,
  ETBAX: 15.00,
  ETDGX: 21.00
};

function formatNumber(num) {
  return num.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function getStockPrice(ticker) {
  try {
    const res = await fetch(`https://api.allorigins.win/raw?url=https://query1.finance.yahoo.com/v7/finance/quote?symbols=${ticker}`);
    const data = await res.json();
    return data.quoteResponse.result[0].regularMarketPrice;
  } catch {
    return fallbackPrices[ticker];
  }
}

async function getBTCPrice() {
  try {
    const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd");
    const data = await res.json();
    return data.bitcoin.usd;
  } catch {
    return 73000;
  }
}

async function update() {
  let total = 0;

  for (let fund of funds) {
    let price = await getStockPrice(fund.ticker);
    let value = price * fund.shares;

    document.getElementById(`${fund.id}-price`).textContent = formatNumber(price);
    document.getElementById(`${fund.id}-value`).textContent = formatNumber(value);

    total += value;
  }

  let btcPrice = await getBTCPrice();
  let btcValue = btcPrice * bitcoinAmount;

  document.getElementById("btc-price").textContent = formatNumber(btcPrice);
  document.getElementById("btc-value").textContent = formatNumber(btcValue);

  total += btcValue;

  document.getElementById("total").textContent = formatNumber(total);
}

update();
setInterval(update, 60000);
</script>

</body>
</html>
