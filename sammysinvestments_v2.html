function format(n){
  return "$" + n.toLocaleString(undefined, {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function animate(el,start,end){
  let t0=null;
  function step(t){
    if(!t0) t0=t;
    let p=Math.min((t-t0)/800,1);
    let val=start+(end-start)*p;
    el.textContent=format(val);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ✅ Yahoo (works for ALL funds)
async function getYahoo(symbol){
  try{
    let r=await fetch(`https://api.allorigins.win/raw?url=https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbol}`);
    let d=await r.json();
    return d.quoteResponse.result[0].regularMarketPrice;
  }catch{return null;}
}
