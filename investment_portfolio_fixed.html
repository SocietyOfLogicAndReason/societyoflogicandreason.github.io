<!DOCTYPE html>
<html>
<head>
  <title>My Investments</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: #fff;
    }
    h1 { margin-top: 40px; }
    .card {
      background: #1e1e1e;
      margin: 20px auto;
      padding: 20px;
      width: 300px;
      border-radius: 10px;
    }
    .total {
      font-size: 24px;
      margin-top: 30px;
      color: #4caf50;
    }
  </style>
</head>
<body>

<h1>My Investment Portfolio</h1>

<div class="card">
  <h2>Eventide Gilead Fund</h2>
  <p>$<span id="gilead">Loading...</span></p>
</div>

<div class="card">
  <h2>Eventide Balanced Fund</h2>
  <p>$<span id="balanced">Loading...</span></p>
</div>

<div class="card">
  <h2>Eventide Dividend Growth</h2>
  <p>$<span id="dividend">Loading...</span></p>
</div>

<div class="total">
  Total: $<span id="total">Loading...</span>
</div>

<script>
const funds = [
  { name: "gilead", ticker: "ETGLX", shares: 121.059 },
  { name: "balanced", ticker: "ETBAX", shares: 682.409 },
  { name: "dividend", ticker: "ETDGX", shares: 533.973 }
];

async function getPrice(ticker) {
  const url = `https://api.allorigins.win/raw?url=https://query1.finance.yahoo.com/v7/finance/quote?symbols=${ticker}`;
  const res = await fetch(url);
  const data = await res.json();
  return data.quoteResponse.result[0].regularMarketPrice;
}

async function update() {
  let total = 0;

  for (let fund of funds) {
    try {
      let price = await getPrice(fund.ticker);
      let value = price * fund.shares;

      document.getElementById(fund.name).textContent = value.toFixed(2);
      total += value;
    } catch {
      document.getElementById(fund.name).textContent = "Error";
    }
  }

  document.getElementById("total").textContent = total.toFixed(2);
}

update();
setInterval(update, 60000);
</script>

</body>
</html>
